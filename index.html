<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="筋肉を守って脂肪だけを落とすための毎日の記録" />
    <meta name="theme-color" content="#F4F7FB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#11151F" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="減量ノート" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>減量ノート</title>
    <script>
      // 保存済みのテーマを描画前に当てて、ダークモードで一瞬白くなるのを防ぐ
      try {
        var t = JSON.parse(localStorage.getItem('genryo-note-v2') || '{}').settings.theme;
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
