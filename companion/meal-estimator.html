<title>減量ノート 食事推定</title>
<style>
/* 減量ノート本体と同じトークン。1列のモバイル用ツール：写真 → 推定 → コピー */
:root {
  --bg: #f4f7fb;
  --sheet: #ffffff;
  --sheet-2: #eff3fa;
  --ink: #141e36;
  --ink-2: #4b5878;
  --ink-3: #69738a;
  --blue: #1f49ae;
  --on-blue: #ffffff;
  --blue-soft: #e4ecfc;
  --red: #c7362b;
  --ok: #1c7f54;
  --warn: #9a5b00;
  --line: #dfe5f0;
  --line-2: #edf1f8;
  --sans: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151f; --sheet: #1a202e; --sheet-2: #222a3b; --ink: #edf0f6; --ink-2: #afb8cc; --ink-3: #8b95aa;
    --blue: #7fa5f5; --on-blue: #0d1730; --blue-soft: #25314b; --red: #ff8d7e; --ok: #5fcb9b; --warn: #f2b455;
    --line: #2c3547; --line-2: #232b3b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151f; --sheet: #1a202e; --sheet-2: #222a3b; --ink: #edf0f6; --ink-2: #afb8cc; --ink-3: #8b95aa;
  --blue: #7fa5f5; --on-blue: #0d1730; --blue-soft: #25314b; --red: #ff8d7e; --ok: #5fcb9b; --warn: #f2b455;
  --line: #2c3547; --line-2: #232b3b; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; display: flex; flex-direction: column; gap: 12px; }
header h1 { margin: 0; font-size: 1.35rem; font-weight: 800; text-wrap: balance; }
header p { margin: 2px 0 0; color: var(--ink-2); font-size: 0.9rem; }
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card h2 { margin: 0; font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.tag { font-size: 0.72rem; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: var(--sheet-2); color: var(--ink-2); }
.tag.ex { background: var(--blue-soft); color: var(--blue); }
.btn { border: 0; border-radius: 12px; background: var(--blue); color: var(--on-blue); font-weight: 700; padding: 12px 16px; min-height: 48px; cursor: pointer; }
.btn.ghost { background: var(--sheet-2); color: var(--ink); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn:focus-visible, .seg button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2.5px solid var(--blue); outline-offset: 2px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 140px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg button { border: 0; border-radius: 10px; background: var(--sheet-2); min-height: 44px; font-weight: 700; cursor: pointer; }
.seg button[aria-checked="true"] { background: var(--blue); color: var(--on-blue); }
label.check { display: flex; align-items: center; gap: 8px; font-size: 0.95rem; }
label.check input { width: 20px; height: 20px; }
.inp { width: 100%; min-height: 46px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); padding: 10px 12px; }
.photo { width: 100%; max-height: 280px; object-fit: cover; border-radius: 12px; display: block; }
.status { margin: 0; color: var(--ink-2); font-size: 0.92rem; min-height: 1.4em; }
.status.err { color: var(--red); }
table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
th, td { padding: 8px 4px; border-top: 1px solid var(--line-2); text-align: right; vertical-align: top; font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; }
thead th { border-top: 0; color: var(--ink-2); font-size: 0.78rem; font-weight: 700; }
td small { display: block; color: var(--ink-2); font-size: 0.78rem; }
tfoot td { font-weight: 800; border-top: 2px solid var(--ink); }
.advice { margin: 0; background: var(--blue-soft); border-radius: 12px; padding: 10px 12px; font-size: 0.95rem; }
.meta { margin: 0; color: var(--ink-2); font-size: 0.85rem; }
.warn { margin: 0; color: var(--warn); font-size: 0.9rem; font-weight: 700; }
.steps { margin: 0; padding-left: 1.3em; color: var(--ink-2); font-size: 0.9rem; }
.steps li + li { margin-top: 4px; }
textarea.copy { width: 100%; min-height: 96px; font-family: ui-monospace, Menlo, monospace; font-size: 0.78rem; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); padding: 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>減量ノート 食事推定</h1>
    <p>写真から品目ごとの kcal とたんぱく質を推定し、減量ノートに貼り付けます。claude.ai の利用枠を使うので、API の料金はかかりません。</p>
  </header>

  <section class="card" aria-labelledby="h-in">
    <h2 id="h-in">食事</h2>
    <img id="photo" class="photo" alt="選んだ食事の写真" hidden>
    <input id="file" type="file" accept="image/*" hidden>
    <button id="pick" class="btn ghost" type="button">写真を撮る・選ぶ</button>
    <div class="seg" id="slots" role="radiogroup" aria-label="食事の区分"></div>
    <label class="check" for="gym"><input id="gym" type="checkbox"> 今日はジムの日</label>
    <input id="note" class="inp" type="text" placeholder="メモ（例：ご飯は150g、学食の生姜焼き定食）" aria-label="メモ">
    <div class="row">
      <button id="run" class="btn" type="button">推定する</button>
      <button id="stop" class="btn ghost" type="button" hidden>止める</button>
    </div>
    <p id="status" class="status" role="status"></p>
  </section>

  <section class="card" aria-labelledby="h-out" id="out">
    <h2 id="h-out">推定結果 <span id="exTag" class="tag ex">例</span></h2>
    <p id="advice" class="advice"></p>
    <table>
      <thead><tr><th>品目</th><th>kcal</th><th>P</th><th>F</th><th>C</th></tr></thead>
      <tbody id="rows"></tbody>
      <tfoot><tr id="total"></tr></tfoot>
    </table>
    <div id="warns"></div>
    <p id="meta" class="meta"></p>
    <button id="copy" class="btn" type="button" disabled>減量ノート用にコピー</button>
    <p id="copyStatus" class="status" role="status"></p>
    <textarea id="copyText" class="copy" readonly hidden aria-label="コピー用の文字"></textarea>
  </section>

  <section class="card" aria-labelledby="h-how">
    <h2 id="h-how">減量ノートへの入れ方</h2>
    <ol class="steps">
      <li>「減量ノート用にコピー」を押す</li>
      <li>ホーム画面の減量ノートを開き、「食事を記録」→「claude.ai の結果を貼り付け」</li>
      <li>数字を確かめて保存（写真からの推定は量で2〜3割ずれることがあります）</li>
    </ol>
  </section>
</div>

<script>
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const SLOTS = { breakfast: "朝", lunch: "昼", snack: "間食", dinner: "夕" };
  const EXAMPLE = {
    is_food: true,
    items: [
      { name: "ご飯", amount: "茶碗1杯（約150g）", kcal: 234, protein_g: 4, fat_g: 1, carb_g: 56 },
      { name: "卵焼き", amount: "卵2個分", kcal: 180, protein_g: 12, fat_g: 13, carb_g: 3 },
      { name: "納豆", amount: "1パック", kcal: 86, protein_g: 7, fat_g: 5, carb_g: 5 },
      { name: "味噌汁", amount: "1杯", kcal: 45, protein_g: 3, fat_g: 1, carb_g: 5 },
    ],
    rice_g: 150, fried: false, sugary_drink: false, heavy_lunch: false, confidence: "medium",
    notes: "卵焼きの油の量で前後します。",
    advice: "このくらいの朝ごはんなら、昼は定食で主菜をしっかり食べれば大丈夫です。",
  };

  let sample = null;
  let caps = null;
  let file = null;
  let fileUrl = null;
  let result = null;
  let lastKey = "";
  let ctl = null;
  let slot = defaultSlot();

  function defaultSlot() {
    const d = new Date();
    const m = d.getHours() * 60 + d.getMinutes();
    if (m < 630) return "breakfast";
    if (m < 900) return "lunch";
    if (m < 1050) return "snack";
    return "dinner";
  }

  /* ---------- 入力 ---------- */
  const slotsEl = $("#slots");
  for (const [k, label] of Object.entries(SLOTS)) {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("role", "radio");
    b.id = "slot-" + k;
    b.textContent = label;
    b.addEventListener("click", () => { slot = k; renderSlots(); });
    slotsEl.append(b);
  }
  function renderSlots() {
    for (const b of slotsEl.children) b.setAttribute("aria-checked", String(b.id === "slot-" + slot));
  }
  renderSlots();

  $("#pick").addEventListener("click", () => $("#file").click());
  $("#file").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    file = f;
    if (fileUrl) URL.revokeObjectURL(fileUrl);
    fileUrl = URL.createObjectURL(f);
    $("#photo").src = fileUrl;
    $("#photo").hidden = false;
    $("#pick").textContent = "写真を撮り直す・選び直す";
    setStatus("");
  });

  function setStatus(text, err) {
    const s = $("#status");
    s.textContent = text;
    s.classList.toggle("err", !!err);
  }

  /* ---------- Claude に頼む ---------- */
  function prompt() {
    const note = $("#note").value.trim();
    const gym = $("#gym").checked;
    return [
      "あなたは日本の家庭料理・学食・コンビニ食に詳しい管理栄養士です。" + (file ? "添付の食事写真とメモ" : "メモ") + "から、品目ごとの量・エネルギー・たんぱく質・脂質・炭水化物を推定してください。",
      "",
      "利用者: 21歳男性・165cm。筋肉を守りながら減量中。1日の目標は約2,050kcal・たんぱく質130g。実家で親の作った料理を食べています。",
      "ルール: ご飯は1食150g（ジムの日の夕食は180g）まで、主菜は手のひら1〜1.5枚、揚げ物は週2回まで、甘い飲み物は避ける、間食は1日200kcalまで。",
      "",
      "推定のしかた:",
      "- 料理を1品ずつ分ける（ご飯・汁物・主菜・副菜・飲み物など）",
      "- 量は茶碗・皿・箸・手などの大きさから見積もり、値は日本食品標準成分表に沿った一般的な値にする",
      "- 調理油・ドレッシング・ソースなど見えにくいカロリーも含める",
      "- メモに量や料理名があれば優先する",
      "- 迷うときは中くらいの見積もりにして confidence を下げる",
      "- 食べ物が写っておらず、メモにも食事の記述がなければ is_food を false にし、items を空にする",
      "",
      "食事区分: " + SLOTS[slot] + (gym ? "（ジムの日）" : ""),
      "メモ: " + (note || "なし"),
      "",
      "次の形の JSON だけを返してください:",
      '{"is_food":true,"items":[{"name":"ご飯","amount":"茶碗1杯（約150g）","kcal":234,"protein_g":4,"fat_g":1,"carb_g":56}],"rice_g":150,"fried":false,"sugary_drink":false,"heavy_lunch":false,"confidence":"medium","notes":"推定の前提や不確かな点を1文","advice":"次の食事でできることを1文。責めない言い方で"}',
      "heavy_lunch はカツ丼・カレー大盛り・ラーメン＋ライスのどれかなら true。confidence は high・medium・low のどれか。rice_g はご飯がなければ 0。",
    ].join("\n");
  }

  const num = (v) => (typeof v === "number" && isFinite(v) && v >= 0 ? Math.round(v) : 0);
  function clean(raw) {
    const o = raw && typeof raw === "object" ? raw : {};
    if (o.is_food === false) throw { code: "not_food" };
    const items = (Array.isArray(o.items) ? o.items : [])
      .map((i) => (i && typeof i === "object" ? i : {}))
      .filter((i) => typeof i.name === "string" && i.name.trim())
      .map((i) => ({
        name: i.name.trim().slice(0, 60),
        amount: typeof i.amount === "string" ? i.amount.slice(0, 60) : "",
        kcal: num(i.kcal), protein_g: num(i.protein_g), fat_g: num(i.fat_g), carb_g: num(i.carb_g),
      }));
    if (!items.length) throw { code: "invalid_json" };
    const conf = ["high", "medium", "low"].includes(o.confidence) ? o.confidence : "medium";
    const text = (v) => (typeof v === "string" ? v.slice(0, 200) : "");
    return {
      is_food: true, items, rice_g: num(o.rice_g), fried: o.fried === true, sugary_drink: o.sugary_drink === true,
      heavy_lunch: o.heavy_lunch === true, confidence: conf, notes: text(o.notes), advice: text(o.advice),
    };
  }

  const MESSAGES = {
    not_food: "食べ物が見つかりませんでした。写真を撮り直すか、メモに料理名を書いてください。",
    images_unavailable: "この画面では写真を送れません。メモだけで推定してください。",
    image_rejected: "この写真は使えません（形式か大きさ）。別の写真を選んでください。",
    rate_limited: "claude.ai の利用上限か、短時間に送りすぎです。しばらくしてから試してください。",
    session_expired: "claude.ai にログインし直してから、もう一度試してください。",
    refused: "この内容は推定できませんでした。メモを変えて試してください。",
    invalid_json: "推定結果を読み取れませんでした。もう一度押してください。",
    empty_completion: "推定結果が空でした。メモを足してもう一度試してください。",
    prompt_too_large: "メモが長すぎます。短くして試してください。",
  };
  const BLOCKED = ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"];

  async function run() {
    if (!sample) return;
    if (!file && !$("#note").value.trim()) {
      setStatus("写真を選ぶか、メモに料理名を書いてください。", true);
      return;
    }
    const key = prompt() + "|" + (file ? file.name + file.size + file.lastModified : "");
    ctl = new AbortController();
    $("#run").disabled = true;
    $("#stop").hidden = false;
    setStatus(file ? "Claude が写真を見ています…（30秒〜1分ほど）" : "Claude が考えています…");
    try {
      const opts = { signal: ctl.signal };
      if (file) opts.images = file;
      // 同じ写真でもう一度押したときは、前の答えを使い回さずに聞き直す
      if (key === lastKey) opts.cache = false;
      const out = await sample.json(prompt(), opts);
      result = clean(out);
      lastKey = key;
      render(result, false);
      setStatus("推定しました。数字を確かめてからコピーしてください。");
    } catch (e) {
      const code = e && e.code;
      if (code === "cancelled") setStatus("止めました。");
      else if (BLOCKED.includes(code)) {
        setStatus("この画面からは Claude を使えません。許可を求められたら「許可」を選んでください。", true);
      } else setStatus(MESSAGES[code] || "うまくいきませんでした。電波の良い場所でもう一度試してください。", true);
    } finally {
      $("#run").disabled = false;
      $("#stop").hidden = true;
      $("#run").textContent = result ? "もう一度推定する" : "推定する";
    }
  }
  $("#run").addEventListener("click", run);
  $("#stop").addEventListener("click", () => ctl && ctl.abort());

  /* ---------- 結果 ---------- */
  function cell(tag, text) {
    const el = document.createElement(tag);
    el.textContent = text;
    return el;
  }

  function render(r, isExample) {
    $("#exTag").hidden = !isExample;
    $("#advice").textContent = r.advice || "";
    const rows = $("#rows");
    rows.replaceChildren();
    const t = { kcal: 0, p: 0, f: 0, c: 0 };
    for (const i of r.items) {
      const tr = document.createElement("tr");
      const name = cell("td", i.name);
      if (i.amount) name.append(cell("small", i.amount));
      tr.append(name, cell("td", String(i.kcal)), cell("td", String(i.protein_g)), cell("td", String(i.fat_g)), cell("td", String(i.carb_g)));
      rows.append(tr);
      t.kcal += i.kcal; t.p += i.protein_g; t.f += i.fat_g; t.c += i.carb_g;
    }
    $("#total").replaceChildren(cell("td", "合計"), cell("td", t.kcal.toLocaleString("ja-JP")), cell("td", String(t.p)), cell("td", String(t.f)), cell("td", String(t.c)));

    const warns = $("#warns");
    warns.replaceChildren();
    const limit = $("#gym").checked && slot === "dinner" ? 180 : 150;
    if (r.rice_g > limit) warns.append(cell("p", "ご飯 約" + r.rice_g + "g（目安" + limit + "g）"));
    if (r.fried) warns.append(cell("p", "揚げ物があります（週2回まで）"));
    if (r.sugary_drink) warns.append(cell("p", "甘い飲み物が含まれています"));
    if (r.heavy_lunch) warns.append(cell("p", "△の昼ごはん（週1回まで）"));
    for (const p of warns.children) p.className = "warn";

    const conf = { high: "高い", medium: "ふつう", low: "低い" }[r.confidence];
    $("#meta").textContent = "確からしさ：" + conf + (r.notes ? "・" + r.notes : "");
    $("#copy").disabled = isExample;
    $("#copyText").hidden = true;
    $("#copyStatus").textContent = isExample ? "推定するとコピーできます。" : "";
  }

  $("#copy").addEventListener("click", async () => {
    if (!result) return;
    const note = $("#note").value.trim();
    const text = JSON.stringify(Object.assign({ genryo_meal: 1, slot: slot, note: note }, result));
    const box = $("#copyText");
    box.value = text;
    try {
      await navigator.clipboard.writeText(text);
      $("#copyStatus").textContent = "コピーしました。減量ノートの「食事を記録」→「claude.ai の結果を貼り付け」へ。";
    } catch {
      box.hidden = false;
      box.focus();
      box.select();
      $("#copyStatus").textContent = "自動でコピーできませんでした。下の文字を長押しして「すべてを選択」→「コピー」してください。";
    }
  });

  render(EXAMPLE, true);

  /* ---------- Claude が使えるか ---------- */
  const use = window.claude && typeof window.claude.use === "function" ? window.claude.use("sample") : Promise.resolve(null);
  $("#run").disabled = true;
  setStatus("準備しています…");
  use.then(async (s) => {
    sample = s;
    if (!s) {
      setStatus("この画面からは Claude を使えません。claude.ai にログインして、このページを開き直してください。", true);
      return;
    }
    caps = await s.limits().catch(() => null);
    if (caps && caps.images) {
      $("#file").accept = caps.images.mediaTypes.join(",");
    } else {
      $("#pick").hidden = true;
      $("#photo").hidden = true;
      file = null;
    }
    $("#run").disabled = false;
    setStatus(caps && caps.images ? "" : "この画面では写真を送れません。メモに料理名と量を書いて推定してください。");
  });
})();
</script>
